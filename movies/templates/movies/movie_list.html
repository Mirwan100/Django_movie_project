{% load static %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Movie Listings @ GV Cinema</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f8f8f8;
        }

        h1 {
            text-align: center;
            margin-top: 30px;
        }

        #searchContainer {
            text-align: center;
            margin: 20px 0;
        }

        #searchBar {
            width: 300px;
            padding: 10px;
            font-size: 16px;
            border-radius: 25px;
            border: 1px solid #ccc;
        }

        h2.section-title {
            margin-left: 40px;
            font-size: 24px;
            margin-top: 30px;
        }

        .movie-list {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 30px;
            padding: 20px 40px;
        }

        .movie-item {
            background: white;
            padding: 10px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }

        .movie-item:hover {
            transform: scale(1.02);
        }

        .movie-poster {
            width: 100%;
            height: 300px;
            object-fit: cover;
            border-radius: 6px;
        }

        .movie-title {
            font-size: 16px;
            font-weight: bold;
            margin-top: 10px;
        }

        .movie-meta {
            font-size: 14px;
            color: #666;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <h1>Movie Listings @ GV Cinema</h1>

    <div id="searchContainer">
        <input type="text" id="searchBar" placeholder="Search movies..." autocomplete="off">
    </div>

    <h2 class="section-title">Popular Movies this month</h2>

    <div class="movie-list" id="movieList">
        {% for movie in movies %}
        <div class="movie-item">
            <a href="{% url 'movie_detail' movie.id %}">
                <img src="{% static movie.imgPath %}" alt="{{ movie.name }}" class="movie-poster">
            </a>
            <div class="movie-title">{{ movie.name }}</div>
            <div class="movie-meta">{{ movie.duration }} min</div>
            <div class="movie-meta">User Rating: {{ movie.userRating }}</div>
        </div>
        {% empty %}
        <p>No movies available at the moment.</p>
        {% endfor %}
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const searchBar = document.getElementById('searchBar');
            const movieList = document.getElementById('movieList');
            searchBar.addEventListener('input', function (e) {
                const searchTerm = e.target.value.toLowerCase();
                const movieItems = movieList.getElementsByClassName('movie-item');

                Array.from(movieItems).forEach(item => {
                    const title = item.querySelector('.movie-title').textContent.toLowerCase();
                    item.style.display = title.includes(searchTerm) ? 'block' : 'none';
                });
            });
        });
    </script>

</body>
</html>
